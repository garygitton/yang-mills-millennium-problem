name: Lean 4 Formal Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean 4 toolchain
        run: |
          lean --version
          lake --version

      - name: Build all Lean 4 formal proofs
        run: |
          lake build

      - name: Execute Referee Verification Script (Strict zero-sorry, zero-admit & LOC checks)
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

